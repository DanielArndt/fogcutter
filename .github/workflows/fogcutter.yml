name: Check External Blockers

on:
  schedule:
    - cron: "0 8 * * *" # Run daily at 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview resolved blockers without executing follow-up actions"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  fogcutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check external blockers
        uses: DanielArndt/fogcutter-action@1b2682f5b17d382e99739c8dc3ad39ed459bf690 # v1.0.0
        with:
          config: .github/blockers.yaml
          dry_run: ${{ inputs.dry_run || false }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
